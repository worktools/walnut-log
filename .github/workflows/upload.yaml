name: Validate and upload

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate

      - uses: calcit-lang/setup-calcit@v1.5.1
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: 0.1.1

      - name: Install dependencies
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Build native dependencies
        run: |
          for name in calcit_std calcit_wss; do
            if [ "$name" = calcit_std ]; then module=.calcit/modules/calcit.std; else module=.calcit/modules/calcit-wss; fi
            cargo build --release --locked --manifest-path "$module/Cargo.toml"
            mkdir -p "$module/dylibs"
            cp "$module/target/release/lib${name}.so" "$module/dylibs/"
          done

      - name: Check target-specific source and tests
        run: |
          set -euo pipefail
          calcit edit format
          git diff --exit-code --quiet -- calcit.cirru
          calcit --check-only --ns 'app.$meta' --ns app.config --ns app.schema --ns app.client --ns app.comp.container --ns app.comp.issue --ns app.comp.login --ns app.comp.navigation --ns app.comp.profile
          calcit --entry server --check-only --ns 'app.$meta' --ns app.config --ns app.schema --ns app.server --ns app.twig.container --ns app.twig.user --ns app.updater --ns app.updater.issue --ns app.updater.router --ns app.updater.session --ns app.updater.user
          calcit fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit --entry server fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit --entry server test --require-match
          calcit analyze weak-types --only deprecated-call --summary-only --format json | jq -e '.data.summary.calls == 0'

      - name: Build frontend with CDN paths
        id: assets
        env:
          CDN_ORIGIN: https://cos-sh.tiye.me
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then prefix="${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/"; else prefix="${GITHUB_REPOSITORY}/"; fi
          base_url="${CDN_ORIGIN}/${prefix}"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "base-url=$base_url" >> "$GITHUB_OUTPUT"
          yarn compile-page
          yarn vite build --base="$base_url"

      - name: Upload frontend to COS and verify public files
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: worktools/cos-upload-action@8c4f3d09a4478b0d4c8698ffb94759b41831cba8 # v1.3.0
        with:
          source-dir: dist
          bucket: ${{ secrets.COS_BUCKET }}
          region: ap-shanghai
          prefix: ${{ steps.assets.outputs.prefix }}
          public-base-url: ${{ steps.assets.outputs.base-url }}
          secret-id: ${{ secrets.COS_SECRET_ID }}
          secret-key: ${{ secrets.COS_SECRET_KEY }}
          verify-attempts: 6

      - name: Deploy frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: '-avzr --progress'
          options: ''
          ssh_options: ''
          src: 'dist/*'
          dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

      - name: Prepare backend source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdir -p dist-server && cp calcit.cirru deps.cirru package.json dist-server/

      - name: Deploy backend source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: Pendect/action-rsyncer@v2.0.0
        env:
          DEPLOY_KEY: ${{ secrets.rsync_private_key }}
        with:
          flags: '-avzr --progress'
          options: ''
          ssh_options: ''
          src: 'dist-server/*'
          dest: 'rsync-user@tiye.me:/servers/calcium-workflow/'
